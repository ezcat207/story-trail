@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17140f;--paper:#201b13;--ink:#f1e9d3;--mute:#a79c82;--line:#4a3f2a;--acc:#e08a5c;--acc2:#6fc2a9;--gold:#f0c24a;--card:#262015;--code:#2d2618}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Songti SC","Noto Serif SC",serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{text-align:center;padding:18px 0 8px}

.sub{color:var(--mute);margin:4px 0 12px}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
button,.tabbtn{font:inherit;font-size:.92rem;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 14px;border-radius:999px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:hover{border-color:var(--acc)}
nav.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.prog{height:10px;background:var(--code);border-radius:99px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--gold));transition:width .3s}
.small{font-size:.85rem;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
/* trail */
.trail{position:relative;margin:18px 0;padding:6px 0}
.trail::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:4px dashed var(--line);transform:translateX(-50%)}
.st{position:relative;display:flex;margin:14px 0}
.st:nth-child(odd){justify-content:flex-start}.st:nth-child(even){justify-content:flex-end}
.node{width:46%;text-align:left;border-radius:14px;padding:10px 12px;background:var(--card);border:2px solid var(--line);display:block}
.node.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.node.done{border-color:var(--acc2)}
.node .n{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;margin-right:6px;font-size:.9rem}
.node.done .n{background:var(--acc2)}
.node b{font-size:1.02rem}.node span.t{display:block;color:var(--mute);font-size:.85rem;margin-top:2px}
.st::after{content:"";position:absolute;left:50%;top:22px;width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px solid var(--bg);transform:translateX(-50%)}
@media(max-width:620px){.trail::before{left:12px}.st,.st:nth-child(even){justify-content:flex-start;padding-left:34px}.node{width:100%}.st::after{left:12px}}

.row{margin:10px 0;padding:10px 12px;background:var(--paper);border-left:5px solid var(--line);border-radius:8px}
.row b.k{display:block;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.row.an{border-color:var(--gold)}.row.ru{border-color:var(--acc2)}.row.pj{border-color:var(--acc)}.row.tr{border-color:#6a5acd}.row.mi{border-color:#b33}
.row ul{margin:4px 0 0 18px;padding:0}
.spoil{font-size:.8rem;color:var(--acc);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.93rem;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--code)}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,monospace;max-height:420px}
.copyrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:700;cursor:pointer}
input[type=checkbox]{width:20px;height:20px}
footer{margin:28px 0 12px;font-size:.82rem;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
.hide{display:none}

const PROMPT={en:"You are a fair, honest, encouraging fiction coach for a young writer (age 13+).\nI will paste a short story (or part of one). Your job is to SCORE it against the rubric below and coach me. You are NOT allowed to rewrite my story.\n\n## Rules for you\n1. Be honest. Do not inflate scores to be nice. A score of 60–75 is normal for a good first draft. 90+ is rare.\n2. Every score must be backed by evidence: quote a short line (under 20 words) from my story, or say \"not found\".\n3. Do not rewrite my paragraphs. You may point at a line and say what is wrong and what question I should ask myself. Give at most ONE tiny example of how a line could work, only if I ask.\n4. If my story is unfinished, score only what exists. For missing parts write \"Not reached yet\" and give 0 for that part, and tell me what the section should do.\n5. Do not judge me on genre, only on craft. Do not reward copying a famous plot. If it looks like a copy of a known story, say so and score originality low.\n6. Keep content age-appropriate. If the story has something unsafe or hurtful, tell me kindly and suggest a different approach.\n7. Use simple words. No jargon without a one-line explanation.\n\n## Before scoring, ask me (and wait for my answer)\n- What is the story's one-sentence premise? (Who wants what, what stands in the way, what happens at the end?)\n- Roughly how many words is it, and is it finished?\n- Which part do I most want feedback on?\n\n## Rubric (100 points)\n| # | Area | Points | What full marks look like |\n|---|---|---|---|\n| 1 | Premise (one-sentence story) | 10 | One sentence shows who, what they want, what blocks them, and a change by the end. Fresh, not a copy. |\n| 2 | Opening | 15 | Starts at the moment things change, not at birth or \"a normal day\". Conflict or a strong question within the first ~200 words. No big info dump. Reader knows whose story it is. |\n| 3 | Hero, goal and stakes | 15 | Hero wants something specific. We know why they cannot just walk away. We know what they lose if they fail (\"the cost\"). The hero acts instead of waiting. |\n| 4 | Middle (escalation and cause-effect) | 20 | Each scene causes the next (\"and so\" / \"but\", not \"and then\"). Problems get worse and costs go up. Hero's choices have believable reasons. No random rescues. |\n| 5 | Climax | 15 | The hardest choice or fight. It is set up earlier (seeds planted). It happens near the last possible moment. The hero DOES something that changes the outcome. It tests who the hero is, not just how strong they are. |\n| 6 | Ending | 10 | Closes the outside problem (the action ending) AND shows the hero has changed or learned something (the meaning ending). Loose threads tied. |\n| 7 | Conflict, dialogue and voice | 10 | Characters want different things. Each speaks differently (cover the names, can you tell who is talking?). Some things are left unsaid (subtext). Voice feels consistent. |\n| 8 | Readability | 5 | Short, concrete sentences. Short paragraphs. Easy to read on a phone. No confusing jumps. |\n\nCaps (apply AFTER adding up):\n- If the climax is solved by luck or by a new helper who was never mentioned before: maximum 70 total.\n- If the hero never has a clear goal: maximum 60 total.\n- If it is mostly copied from an existing story: maximum 40 total.\n\n## Output format\n1. **Total: X / 100** and a one-line verdict.\n2. A table: Area | Score | Evidence (short quote or \"not found\") | One question I should ask myself.\n3. **Top 3 strengths** (specific).\n4. **Top 3 fixes**, ordered by how many points I could gain. For each: which line or scene, what the problem is, and which tool from the Story Trail map to use (e.g. \"Station 5: Dominos\").\n5. **My next step**: one small thing I can do in 20 minutes.\n6. **Confidence**: how sure you are of this scoring, and what you could not judge.\n\nAfter you finish, wait. If I fix something and paste a new version, re-score only the changed areas and tell me what improved.\n\n---\nMy story starts below:\n",zh:"你是一位公平、诚实、鼓励式的小说教练，面向 13 岁以上的小作者。\n我会把一篇短篇故事（或其中一部分）贴给你。你的任务是按下面的评分表给它打分，并指导我。**你不可以替我改写故事。**\n\n## 你要遵守的规则\n1. 诚实。不要为了让我高兴而抬高分数。一份不错的初稿通常是 60–75 分，90 分以上很少见。\n2. 每一项分数都要有证据：引用我故事里的一句话（不超过 20 个字），或者写“没有找到”。\n3. 不要改写我的段落。你可以指出某一句哪里有问题，并给我一个“我应该问自己的问题”。只有我主动要求时，才可以给**一个很小的**示范。\n4. 如果故事没写完，只评已有的部分。缺失的部分写“还没写到”，该项记 0 分，并告诉我这一部分应该完成什么任务。\n5. 只评技巧，不评类型。不要奖励抄袭知名故事的情节；如果看起来像照搬，请直接说出来，并把原创性扣低。\n6. 内容要适合未成年人。如果故事中有不安全或伤人的内容，请温和地告诉我，并建议换一种写法。\n7. 用简单的词。出现专业词要加一句话解释。\n\n## 打分之前，请先问我（等我回答后再继续）\n- 这个故事的一句话是什么？（谁想要什么，什么挡着他，最后发生了什么？）\n- 大概多少字？写完了吗？\n- 我最想听哪一部分的反馈？\n\n## 评分表（共 100 分）\n| # | 项目 | 分值 | 满分是什么样 |\n|---|---|---|---|\n| 1 | 一句话故事 | 10 | 一句话里能看出：谁、想要什么、什么挡着他、最后有什么变化。新鲜，不是照搬。 |\n| 2 | 开头 | 15 | 从“事情开始变了”的那一刻开始，而不是从出生或“平常的一天”开始。前 200 字左右出现冲突或强烈的问题。没有大段背景说明。读者知道这是谁的故事。 |\n| 3 | 主角、目标与代价 | 15 | 主角想要的东西很具体。我们知道他为什么不能转身离开。我们知道失败会失去什么（代价）。主角在行动，而不是等待。 |\n| 4 | 中段（升级与因果） | 20 | 一个场景引出下一个（“于是”“但是”，而不是“然后”）。麻烦越来越大，代价越来越高。主角的选择有可信的理由。没有凭空出现的救星。 |\n| 5 | 高潮 | 15 | 最难的选择或最难的一战。前面有铺垫（种子已种下）。发生在最后一刻附近。主角**亲自做了一件事**改变了结果。考验的是“主角是什么样的人”，不只是“他有多强”。 |\n| 6 | 结尾 | 10 | 既解决外部问题（动作结局），又显示主角变了或明白了什么（意义结局）。线索都收好了。 |\n| 7 | 冲突、对话与声音 | 10 | 角色想要的东西不同。每个人说话方式不同（盖住名字，你能看出谁在说话吗？）。有话没说出口（潜台词）。声音前后一致。 |\n| 8 | 好读 | 5 | 句子短、词具体、段落短，手机上也好读。没有让人看不懂的跳跃。 |\n\n扣分上限（在加完分后使用）：\n- 如果高潮靠运气解决，或靠一个前面从没提过的新帮手解决：总分最高 70。\n- 如果主角从头到尾没有明确目标：总分最高 60。\n- 如果大部分是照搬现有故事：总分最高 40。\n\n## 输出格式\n1. **总分：X / 100**，加一句话评语。\n2. 一张表：项目｜得分｜证据（短引用或“没有找到”）｜我该问自己的一个问题。\n3. **最强的 3 点**（要具体）。\n4. **最该改的 3 点**，按“改好能多得几分”排序。每一点写清：哪一句/哪个场景、问题是什么、该用 Story Trail 地图里的哪个工具（例如“第 5 站：多米诺”）。\n5. **我的下一步**：一件 20 分钟能做完的小事。\n6. **把握程度**：你对这次打分有多确定，哪些地方你没法判断。\n\n给完反馈后请等我。如果我改了东西再贴新版本，只重新评改动的部分，并告诉我哪里进步了。\n\n---\n我的故事从下面开始：\n"};
const GUIDE=[{"title": "Start Here: How This Guide Works", "html": "<h1>Start Here: How This Guide Works</h1>\n<p><em>8 min read</em></p>\n<p><strong>The picture:</strong> Think of writing a short story like planning a road trip. You can wander and hope for the best, or you can look at a map first. A map will not drive the car for you. You still pick the music, the snacks, and the weird detour. But it stops you from ending up in a swamp at midnight.</p>\n<p>This guide is that map, written for writers 13 and up. It has 14 short chapters after this one. You do not have to read them in order. Each one answers one question writers get stuck on. Stuck on a boring opening? Jump to the opening chapter. Stuck on a hero who feels flat? Go to the hero chapter. The map works even if you start in the middle.</p>\n<h2>Who this guide is for</h2>\n<p>You might be someone who has never finished a story. You might have six half-finished ones in a folder called \"NEW NEW FINAL.\" You might just like stories and want to try making one. All of those people are welcome here.</p>\n<p>You do not need to be \"talented.\" Writing is a craft, like skateboarding or cooking. Some people start with a bit more natural balance. Everyone gets better with practice and a few good tricks. This guide is the tricks.</p>\n<h2>How each chapter works</h2>\n<p>Every chapter has the same shape, so you always know where you are.</p>\n<ul>\n<li><strong>The picture:</strong> a comparison to something from real life, so the idea sticks. If you forget everything else, you will still remember the picture.</li>\n<li><strong>The rules:</strong> the idea in plain words. These are not laws. They are habits that work most of the time. When you break one, know that you are breaking it, and have a reason.</li>\n<li><strong>Worked examples:</strong> a weak version, why it fails, and a stronger version. Seeing the fix is faster than hearing a lecture.</li>\n<li><strong>Percy Jackson check:</strong> how <em>The Lightning Thief</em> uses the idea. (Spoilers ahead. If you have not read it, the short version: a kid finds out he is a demigod and must clear his name and stop a war between gods in ten days.) You do not need to love the book. It is just a handy example that millions of readers already know.</li>\n<li><strong>Common mistakes:</strong> the traps most beginners fall into. Spot them early and you skip months of frustration.</li>\n<li><strong>Mini-quiz:</strong> three quick questions to check that the idea landed.</li>\n<li><strong>Try it (20 min):</strong> one small thing to do. Reading about writing does not make you better. Writing does.</li>\n<li><strong>Level up:</strong> a harder exercise for when the first one felt easy.</li>\n</ul>\n<h2>A word on jargon</h2>\n<p>Writers love fancy words. We will use a few, but every time, we will explain it in one line. For example: a <strong>beat</strong> is one small moment in a story where something changes. See? Not scary.</p>\n<h2>Three promises</h2>\n<ol>\n<li><strong>Short stories are the training ground.</strong> They are small enough to finish, and finishing is a skill. A novel is a marathon. You do not run a marathon on day one.</li>\n<li><strong>You are the author.</strong> Use AI as a coach that points at problems, never as the one who writes your story. A coach can say, \"Your middle sags.\" A coach should not run the race for you. The moment someone else writes your sentences, the story stops being yours, and you stop learning.</li>\n<li><strong>A bad first draft is normal.</strong> A finished bad draft beats a perfect first page every time. Professional authors write terrible first drafts. They just do not show them to you.</li>\n</ol>\n<h2>Three worked examples</h2>\n<h3>Example 1: Picking a first goal</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>\"I want to write the greatest fantasy novel ever, with seven books, and a map, and a made-up language.\"</p>\n</blockquote>\n<p><strong>Why it fails:</strong> The goal is so big that you cannot start. There is no finish line. You will spend three weeks on the language and zero days on the story. Big dreams are fine, but a big dream with no first step is just a daydream.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>\"I will write a 2,000-word story about a kid who finds a door in the school gym that was not there yesterday. I will finish a rough draft in two weeks.\"</p>\n</blockquote>\n<p><strong>Why it works:</strong> It is small. It has a number. It has a deadline. It even has a spark of a story already (a mystery door). You can finish this. And then you can do it again, bigger.</p>\n<h3>Example 2: Reading like a writer</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>You read a story, say \"That was cool,\" and move on.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> You enjoyed it, but you learned nothing you can reuse. It is like eating a great sandwich and not asking what was in it.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>You read a story, then write two lines: \"The moment I got hooked was <strong><em>. The author did it by </em></strong>.\"</p>\n</blockquote>\n<p>Maybe you write: \"I got hooked when the narrator admitted she had lied to her best friend in the first paragraph. The author did it by giving me a secret right away.\" Now you own a trick. You can use it next week.</p>\n<h3>Example 3: Handling a stuck day</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>You stare at a blank page for forty minutes, decide you are bad at this, and watch videos instead.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> Blank-page panic is not a talent problem. It is a \"too much pressure\" problem. Staring harder does not fix it.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>You set a timer for ten minutes and write the worst possible next sentence on purpose. \"Then a sandwich exploded.\" Keep going until the timer rings.</p>\n</blockquote>\n<p><strong>Why it works:</strong> Bad on purpose is safe. Once words are on the page, you can fix them. You cannot fix a blank page.</p>\n<h2>How to use this guide in four weeks</h2>\n<p>Here is one simple plan. Change it however you like.</p>\n<table>\n<thead>\n<tr>\n<th>Week</th>\n<th>Chapters</th>\n<th>Goal</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Ideas, One Sentence, Hero</td>\n<td>Pick an idea and know who it is about</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Outline, Three Acts, Opening</td>\n<td>Sketch the shape and write page one</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Middle, Climax, Ending</td>\n<td>Finish a rough draft</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Conflict, Dialogue, Hooks, Revise</td>\n<td>Make it better</td>\n</tr>\n</tbody>\n</table>\n<p>The last chapter, on short versus long stories, is a bonus for when you want to stretch out.</p>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Reading all the chapters before writing a word.</strong> This feels productive. It is actually a clever form of hiding. Read one chapter, do its exercise, then read the next.</li>\n<li><strong>Skipping the \"Try it\" boxes.</strong> They are the whole point. Twenty minutes is less time than one TV episode.</li>\n<li><strong>Treating the rules as a cage.</strong> Rules are training wheels. Once you can ride, you can ride however you want.</li>\n<li><strong>Comparing your draft to a published book.</strong> That book was rewritten many times and edited by professionals. Compare your draft to your own last draft instead.</li>\n<li><strong>Waiting to feel inspired.</strong> Inspiration is a visitor who comes more often if you are already at your desk.</li>\n<li><strong>Letting AI write the hard parts.</strong> If it is hard, that is exactly where you are learning. Ask AI for questions, not sentences.</li>\n<li><strong>Quitting at the messy middle.</strong> Every story gets messy around the halfway mark. That is not a sign to stop. It is a sign you are in the middle.</li>\n</ul>\n<h2>Percy Jackson check</h2>\n<p>Why does this guide use <em>The Lightning Thief</em> so much? Because it is a clean example of a story that does the basics well. It has a clear hero, a clear goal, a ticking clock, and a road trip with trouble at every stop. Rick Riordan wrote it, as the author's own note tells us, first as bedtime stories for his son. That is a nice reminder that big books can start as a small, simple \"what happens next?\" told out loud.</p>\n<p>When we check a chapter idea against the book, we are not saying your story should copy it. We are saying: look, here is how one working story handles this. Then do your own version with your own characters and jokes.</p>\n<p>Lines marked \"our own\" in these chapters are original imitations written for this guide, not quotes from the book.</p>\n<h2>Mini-quiz</h2>\n<p><strong>1. Why does this guide say to finish a bad draft instead of polishing page one?</strong>\n<em>Answer:</em> Finishing teaches you how a whole story fits together, and you can only fix a draft that exists.</p>\n<p><strong>2. What is the right way to use AI while writing?</strong>\n<em>Answer:</em> As a coach that points at problems and asks questions. You write the sentences yourself.</p>\n<p><strong>3. In what order must you read the chapters?</strong>\n<em>Answer:</em> Any order. Jump to the one that answers your current problem.</p>\n<h2>Try it (20 min)</h2>\n<ol>\n<li>Grab a notebook or open a blank note.</li>\n<li>Write down one story you love (book, movie, or game).</li>\n<li>Under it, write: \"The moment I got hooked was <strong><em>. I think it worked because </em></strong>.\"</li>\n<li>Then write: \"The story I want to finish in the next month is about ___.\" One sentence is plenty.</li>\n<li>Put a date on it. Done.</li>\n</ol>\n<h2>Level up</h2>\n<p>Make a \"writer's toolbox\" page. Title it with your name. Every time you finish a chapter of this guide, add one line to it: the single trick you plan to use. After five chapters, read the page out loud. That list is your personal style guide, and it is already better than most beginners have.</p>\n<p>For extra credit, find a friend who also wants to write. Swap one-sentence stories and each say one thing you would want to read more about. Do not say \"it was good.\" Say what you want to know next. That is the most useful thing a reader can tell a writer.</p>"}, {"title": "Collecting Ideas: Fill Your Pantry", "html": "<h1>Collecting Ideas: Fill Your Pantry</h1>\n<p><em>8 min read</em></p>\n<p><strong>The picture:</strong> A chef does not invent dinner from nothing at 6 p.m. They have a pantry. Flour, onions, a weird jar of pickled something. When it is time to cook, they look at the shelves and start combining. Your head needs a pantry too. Ideas come when you have stuff on the shelves.</p>\n<p>Most people think writers wait for a big lightning bolt of an idea. Real writers mostly do something less glamorous. They collect small things all the time, and later they notice how the small things fit together.</p>\n<h2>The rules</h2>\n<ul>\n<li><strong>Carry a catcher.</strong> Notes app, voice memos, a pocket notebook, the back of your hand if you must. An idea you do not catch is gone in about ninety seconds.</li>\n<li><strong>Collect three kinds of things:</strong></li>\n<li><strong>Weird facts</strong> (\"a town in Norway where it is against the law to die\").</li>\n<li><strong>Real moments</strong> (an argument you overheard, the way your uncle laughs before he tells a lie).</li>\n<li><strong>\"What if\" questions</strong> (\"what if the school cafeteria menu was a secret code?\").</li>\n<li><strong>Do not judge while collecting.</strong> Judging is a different job for a different day. If you judge each idea the second it arrives, you will scare the good ones away.</li>\n<li><strong>Mix two unrelated things.</strong> A lighthouse plus a pizza delivery. A ghost plus a group chat. The collision is where stories start.</li>\n<li><strong>Steal the feeling, not the plot.</strong> If a movie made your stomach drop, ask what made it drop. Use that trick in your own world, with your own people.</li>\n<li><strong>Ask \"and then what?\" twice.</strong> The first answer is usually the obvious one. The second is where it gets interesting.</li>\n</ul>\n<h2>From a spark to a story idea</h2>\n<p>A spark is not yet a story. A <strong>spark</strong> is just a cool thing: an image, a fact, a feeling. A <strong>story idea</strong> is a spark plus a person who wants something and has trouble getting it. The trick is turning one into the other.</p>\n<p>Here is a simple recipe:</p>\n<ol>\n<li>Start with the spark.</li>\n<li>Ask: <em>Who would care most about this?</em></li>\n<li>Ask: <em>What do they want because of it?</em></li>\n<li>Ask: <em>What could go wrong?</em></li>\n</ol>\n<h2>Three worked examples</h2>\n<h3>Example 1: A spark with no story</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>\"A haunted vending machine.\"</p>\n</blockquote>\n<p><strong>Why it fails:</strong> It is a cool image, but nothing is happening. No one wants anything. It is a poster, not a plot. Many beginners stop here and wonder why they cannot write page two.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>Maya works the night shift at a bus station with her grandfather. Every night at 2:14 a.m., the vending machine gives her a snack she did not pay for, and each snack matches something that will go wrong tomorrow. A cracked cookie, a spilled juice. When it gives her a candle, she has to figure out who in her life is about to be in the dark.</p>\n</blockquote>\n<p>Now there is a person (Maya), something to figure out, and a ticking feeling. The spark got a heartbeat.</p>\n<h3>Example 2: Mixing two ideas</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>Take \"a dragon\" and \"a school.\" Result: a dragon attends a school. The end.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> You put two things next to each other, but nothing crashes. A mash-up needs a <strong>friction point</strong>, which is the place where the two things rub badly against each other.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>A dragon must pass the school's hall-pass rule: students may not leave class without a signed slip. But the dragon's wing is too big for the door and the teacher says, \"Rules are rules.\" Now the dragon is trapped and tired, and a student named Eli has to decide whether to break a rule to help.</p>\n</blockquote>\n<p>The friction is the rule meeting the wing. A funny problem becomes a real choice for Eli. That is a story.</p>\n<h3>Example 3: Turning a real moment into a plot</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>\"I once got lost at the mall. I will write about that.\"</p>\n</blockquote>\n<p><strong>Why it fails:</strong> Real life is a great supplier, but a diary entry is not a story. Real life has no shape. It wanders and fizzles out.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>Keep the feeling (the cold drop in your stomach when you cannot find your parent) and change everything else. Put a twelve-year-old girl in a mall that closes early because of a storm. The lights go off in sections. The only other person left is a security guard who is acting oddly. She wants to get out, and the doors are locking one by one.</p>\n</blockquote>\n<p>You kept the true emotion and built a made-up engine around it. That is the best use of real life.</p>\n<h2>Where to hunt for ideas</h2>\n<table>\n<thead>\n<tr>\n<th>Place</th>\n<th>What to look for</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>School hallways</td>\n<td>Odd rules, rumors, who sits with who</td>\n</tr>\n<tr>\n<td>Family dinners</td>\n<td>Stories adults tell again and again</td>\n</tr>\n<tr>\n<td>News headlines</td>\n<td>A strange event that leaves you asking \"why?\"</td>\n</tr>\n<tr>\n<td>Old photos</td>\n<td>A face with a secret in it</td>\n</tr>\n<tr>\n<td>Your own embarrassments</td>\n<td>They are full of feeling</td>\n</tr>\n<tr>\n<td>Dreams</td>\n<td>Write them down right away, they fade fast</td>\n</tr>\n<tr>\n<td>Songs</td>\n<td>Pick one lyric and ask what happened before it</td>\n</tr>\n</tbody>\n</table>\n<h2>Keeping the pantry fresh</h2>\n<p>A pantry gets stale if you only ever add to it. Once a week, spend five minutes with your list. Cross out items that no longer excite you. Star the ones that still make you curious. Group similar items together, because patterns show up fast: maybe half your notes are about secrets, or about being the new kid. Patterns like that tell you what you care about, and caring is what makes a story feel alive.</p>\n<p>Also feed the pantry on purpose. Read a book outside your usual taste. Watch a documentary about something you know nothing about. Ask a grandparent what the strangest job they ever had was. Strange input makes strange, fresh output.</p>\n<h2>Percy Jackson check</h2>\n<p>The big idea of <em>The Lightning Thief</em> is a mix. Take ancient Greek gods. Drop them in modern New York. Make a kid with ADHD and dyslexia the hero, and explain those as signs of his demigod brain. (ADHD makes it hard to sit still and focus. Dyslexia makes reading words tricky. In the book, the restlessness is battle-ready instincts and the reading trouble is a brain wired for ancient Greek.)</p>\n<p>Old myths plus a today-kid plus a clever twist equals a pantry mash-up. And look at the friction: a god-sized problem lands on a kid who is just trying not to get kicked out of school again. That tension gives the jokes and the stakes.</p>\n<p>Here is a line in the same spirit, <strong>our own</strong> imitation and not from the book: <em>\"My math teacher turned out to be a retired sea monster, which honestly explained the pop quizzes.\"</em> The joke works because the weird thing sits next to the boring thing.</p>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Waiting for the \"perfect\" idea.</strong> It does not exist. Good ideas are usually just okay ideas that were developed well.</li>\n<li><strong>Judging too fast.</strong> \"That's dumb\" is the quickest way to kill something that might have grown.</li>\n<li><strong>Stopping at the cool image.</strong> An image without a person and a problem is a wallpaper.</li>\n<li><strong>Copying a plot beat for beat.</strong> Borrowing a feeling is fine. Borrowing every event is just a worse copy.</li>\n<li><strong>Keeping ideas only in your head.</strong> Your head is a leaky bucket. Write them down.</li>\n<li><strong>Choosing the first idea, always.</strong> Make a list of at least ten. The first few are usually the ones everyone else would also think of.</li>\n<li><strong>Collecting forever and never writing.</strong> A pantry is for cooking. At some point, light the stove.</li>\n</ul>\n<h2>Mini-quiz</h2>\n<p><strong>1. What is the difference between a spark and a story idea?</strong>\n<em>Answer:</em> A spark is a cool image or fact. A story idea adds a person who wants something and has trouble getting it.</p>\n<p><strong>2. Why does mixing two things work better when there is a \"friction point\"?</strong>\n<em>Answer:</em> Friction creates a problem, and problems create choices, which create plot.</p>\n<p><strong>3. Why should you avoid judging ideas while collecting them?</strong>\n<em>Answer:</em> Judging early scares off ideas that might grow. Collect first, choose later.</p>\n<h2>Try it (20 min)</h2>\n<ol>\n<li>Set a timer for 10 minutes.</li>\n<li>Write 10 \"what if\" lines in a row without stopping. Do not cross anything out. Silly is fine.</li>\n<li>Circle two that could mash together.</li>\n<li>With the last 10 minutes, write one paragraph that combines the two. Ask: who wants what, and what is in the way?</li>\n</ol>\n<p>Do not worry if it is messy. You are not building the house yet. You are finding the lumber.</p>\n<h2>Level up</h2>\n<p>Start a <strong>pantry file</strong>. Make one note on your phone or page in a notebook called \"Pantry.\" For the next seven days, add at least three items a day: one weird fact, one real moment, one \"what if.\" On day seven, read the whole list and highlight everything that gives you a little shiver.</p>\n<p>Then try the <strong>rule of three collisions</strong>. Pick any three items from your pantry and force them into a single story idea. A lighthouse, a group chat, and a missing shoe? Fine. Write a one-paragraph pitch. Some combos will be silly. One of them might surprise you, and that is the whole point. The more shelves you stock, the more meals you can make.</p>"}, {"title": "The One-Sentence Story: Your Compass", "html": "<h1>The One-Sentence Story: Your Compass</h1>\n<p><em>8 min read</em></p>\n<p><strong>The picture:</strong> A compass does not show every tree. It shows which way is north. Your one-sentence story does the same. When you are lost in chapter six, it tells you which way the story is going. You can wander left and right, climb a hill, chase a squirrel. But you always know where north is.</p>\n<p>Writers call this sentence a <strong>logline</strong>. (A logline is a one-line summary of a story, the kind you might read on the back of a movie case.) You do not need it for the reader. You need it for you.</p>\n<h2>Why one sentence?</h2>\n<p>Because a story you cannot say in one breath is usually a story you do not understand yet. That is not an insult. It is a clue. If your explanation starts with \"Well, it's complicated, there's this world, and it has three kingdoms, and...\" then the story is still fog. Fog is fine early on. Fog is not fine when you have written 5,000 words.</p>\n<h2>The formula</h2>\n<blockquote>\n<p>When <strong>[something happens]</strong>, a <strong>[kind of hero]</strong> must <strong>[goal]</strong> before <strong>[deadline or cost]</strong>, but <strong>[what stands in the way]</strong>.</p>\n</blockquote>\n<p>Not every story fits it exactly, but fill in the blanks and you will find out fast whether you have a story or just a cool setting.</p>\n<h2>Test your sentence</h2>\n<ul>\n<li>Is there a <strong>person</strong> with a <strong>want</strong>? (Not \"a world with magic.\")</li>\n<li>Is there something <strong>blocking</strong> the want?</li>\n<li>Is there a <strong>cost</strong> if they fail?</li>\n<li>Could a stranger repeat it back in one breath?</li>\n<li>Does it show <strong>change</strong>? (Something happens that pushes the hero off their normal path.)</li>\n<li>Is it specific? \"A girl goes on an adventure\" is true of ten thousand books. Add a detail that is only yours.</li>\n</ul>\n<h2>Three worked examples</h2>\n<h3>Example 1: The setting-only sentence</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>\"A story about a floating city where people live in the clouds.\"</p>\n</blockquote>\n<p><strong>Why it fails:</strong> It describes a place, not a plot. There is no hero, no want, no problem. A reader cannot tell what will happen. You could write a thousand pages and never get to a story.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>When the cable holding her floating city to the mountain starts to fray, a young rope-mender named Tali must find the one person who knows how to fix it before the city drifts out to sea, but the only expert is the man who was banished for cutting a cable years ago.</p>\n</blockquote>\n<p>Now there is a person (Tali), a goal (fix the cable), a clock (before the city drifts), and an obstacle (the banished expert might be the villain). The cloud city is still there. It just got a job.</p>\n<h3>Example 2: The vague goal</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>\"A boy who is sad about his dog dying has to learn to be happy again.\"</p>\n</blockquote>\n<p><strong>Why it fails:</strong> \"Learn to be happy\" is a wish, not a goal. You cannot see it. There is no clock and nothing to do. The story has no way to move from scene to scene.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>When his late dog's tag turns up in a stranger's yard, a grieving eighth-grader must sneak into the neighbor's house before the family moves away on Saturday to find out whether the dog was really his, but the neighbor's teenage daughter has caught him and has her own reasons to keep him quiet.</p>\n</blockquote>\n<p>The feeling (grief) is still the heart. But now it has an outside action to carry it. Readers feel sad things best when characters are doing something about them.</p>\n<h3>Example 3: The too-crowded sentence</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>\"A teen wizard, a robot sidekick, and a talking cat must stop the evil queen, find the lost crown, escape the volcano, and win the school talent show before the moon turns red and also his parents get a divorce.\"</p>\n</blockquote>\n<p><strong>Why it fails:</strong> Too many goals. A compass cannot point to five norths. A reader cannot hold this in one breath, and neither can you.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>When the moon begins to turn red, a clumsy teen wizard must find the lost crown before the queen does, but his only guide is a robot that keeps losing the map.</p>\n</blockquote>\n<p>You can add the cat, the talent show, and everything else later as scenes in the story. The sentence keeps just the spine.</p>\n<h2>How to write one fast</h2>\n<ol>\n<li>Write the messy version, as long as you like.</li>\n<li>Cross out anything that is not the hero, the want, the clock, or the blocker.</li>\n<li>Put it in the formula.</li>\n<li>Read it out loud. If you stumble, simplify.</li>\n<li>Check the four questions above.</li>\n</ol>\n<h2>Fixing a sentence that feels flat</h2>\n<p>Sometimes you fill in every blank and the sentence still feels dead. Here are four quick repairs.</p>\n<ul>\n<li><strong>Sharpen the hero.</strong> \"A girl\" is blank paper. \"A girl who cannot stop telling the truth\" is a person. One odd trait is enough.</li>\n<li><strong>Raise the cost.</strong> Ask what the hero loses if she fails. Then ask what else she could lose. Pick the one that hurts the most.</li>\n<li><strong>Shrink the clock.</strong> \"Someday\" is not a deadline. \"By Saturday night\" is. Short clocks make readers lean forward.</li>\n<li><strong>Make the blocker personal.</strong> A storm is an obstacle. A storm plus your estranged brother steering the only boat is a story.</li>\n</ul>\n<p>Try the repair that fits your sentence, then read it out loud again. Does your voice speed up? That's a good sign. If it slows down, you probably added a detail that does not carry weight, so cut it.</p>\n<p>Also remember that a sentence can be fun. If you smile while writing it, readers will smile too. The best loglines have a tiny spark of irony, such as a hero who is the worst possible person for the job. A shy kid must lead the school tour for a famous visitor. A cat-sitter must guard a cat that is secretly a king. Contrast is cheap and powerful.</p>\n<h2>Percy Jackson check</h2>\n<p>When a god's weapon is stolen and Percy is blamed, he must find it and return it within ten days before the gods start a war, but monsters and a traitor are in his way. One breath. Hero, want, clock, blockers.</p>\n<p>Notice what that sentence leaves out: the summer camp, the Greek jokes, the road trip stops, the Oracle. All of those are in the book. None of them are in the compass. That is how a compass works. The sentence is the spine, and the story is the whole body.</p>\n<p>Here is a sentence in the same shape, <strong>our own</strong> and not from the book: <em>\"When the school mascot costume is stolen and Dani is blamed, she must track it down before Friday's big game, but the real thief is someone on her own team.\"</em> Same engine, different car.</p>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Describing the world, not the plot.</strong> If the sentence has no verb for the hero, it has no story.</li>\n<li><strong>Using a vague goal.</strong> \"Find herself,\" \"be happy,\" and \"grow up\" cannot be seen. Make the goal something you could film.</li>\n<li><strong>Leaving out the clock.</strong> No deadline means no pressure. The story can sit forever.</li>\n<li><strong>Skipping the blocker.</strong> Without an obstacle, the hero just walks to the goal. Boring.</li>\n<li><strong>Listing every character.</strong> Name the hero. Hint at the rest.</li>\n<li><strong>Spoiling the ending.</strong> The sentence sets up the question. It does not answer it.</li>\n<li><strong>Never updating it.</strong> If the story changes while you write, change the sentence. A compass that points the wrong way is worse than none.</li>\n</ul>\n<h2>Mini-quiz</h2>\n<p><strong>1. What are the four things a good one-sentence story needs?</strong>\n<em>Answer:</em> A hero, a goal (want), a deadline or cost, and an obstacle.</p>\n<p><strong>2. Why is \"a boy must learn to be happy again\" a weak goal?</strong>\n<em>Answer:</em> It is not something you can see or do. A goal needs an action the hero can take.</p>\n<p><strong>3. Should the sentence include the ending?</strong>\n<em>Answer:</em> No. It sets up the problem and leaves the reader asking how it ends.</p>\n<h2>Try it (20 min)</h2>\n<ol>\n<li>Pick your story idea from the last chapter.</li>\n<li>Write your sentence three times, each with a different blocker. For example: a person, a place, and the hero's own flaw.</li>\n<li>Pick the one that makes you want to know what happens.</li>\n<li>Write it on a sticky note and put it where you will see it while you write.</li>\n</ol>\n<h2>Level up</h2>\n<p>Try the <strong>reverse logline</strong>. Pick a book, movie, or game you love. Without looking it up, write its one-sentence story using the formula. Then check your sentence against a friend's version of the same story. Where did you disagree? Those gaps show what each of you thought the story was <em>about</em>.</p>\n<p>Then try the <strong>twist swap</strong>: take your own sentence and change just one word in the \"but\" part. If the blocker was \"a rival,\" try \"a storm.\" If it was \"a storm,\" try \"a promise she made.\" Notice how a single swap sends the whole story down a different road. When you feel a little jealous of the new version, you have found a better compass.</p>"}, {"title": "Hero, Want, and Cost: The Engine", "html": "<h1>Hero, Want, and Cost: The Engine</h1>\n<p><em>9 min read</em></p>\n<p><strong>The picture:</strong> A car needs fuel and a destination. Your hero's <strong>want</strong> is the destination. The <strong>cost of failing</strong> is the fuel, because it is the reason the hero keeps driving when the road gets bad. A car with a destination and no fuel sits in the driveway. A car with fuel and no destination just goes in circles. You need both.</p>\n<p>When readers say a character \"feels real,\" they usually mean this: the character wants something badly, and we believe it.</p>\n<h2>The rules</h2>\n<ul>\n<li><strong>A want must be specific.</strong> \"Be happy\" is a wish. \"Win the regional robotics trophy so Dad notices me\" is a want. A good test: could you film it? You can film someone building a robot. You cannot film \"happiness.\"</li>\n<li><strong>Give a reason they cannot walk away.</strong> If the hero can quit with no consequences, the reader can too. Ask: what happens if they just go home?</li>\n<li><strong>Wants and needs are different.</strong> The <strong>want</strong> is the thing they chase. The <strong>need</strong> is what they actually have to learn. Great stories let them chase one and find the other. A kid wants to win the trophy (want) but needs to learn to ask for help (need).</li>\n<li><strong>Make the hero act.</strong> Heroes who just react to things happening are passengers. Let them make choices, even wrong ones. Wrong choices are great: they cause trouble, and trouble is the story.</li>\n<li><strong>Flaws are handles.</strong> A small flaw gives the reader something to hold and gives the story something to break. Perfect people are slippery. Nobody can hold on.</li>\n<li><strong>Give them one thing they are good at.</strong> A flaw alone makes someone annoying. A skill makes us root for them.</li>\n<li><strong>Let the cost grow.</strong> At first, failure costs a little. By the end, it should cost almost everything.</li>\n</ul>\n<h2>Want, need, and cost at a glance</h2>\n<table>\n<thead>\n<tr>\n<th>Piece</th>\n<th>Question it answers</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Want</td>\n<td>What is the hero chasing?</td>\n<td>Win the science fair</td>\n</tr>\n<tr>\n<td>Cost</td>\n<td>What do they lose if they fail?</td>\n<td>The scholarship, and Mom's trust</td>\n</tr>\n<tr>\n<td>Flaw</td>\n<td>What gets in their own way?</td>\n<td>Never asks for help</td>\n</tr>\n<tr>\n<td>Need</td>\n<td>What must they learn?</td>\n<td>That teamwork is not weakness</td>\n</tr>\n</tbody>\n</table>\n<h2>Three worked examples</h2>\n<h3>Example 1: The wish instead of the want</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>\"Jordan wants to be popular.\"</p>\n</blockquote>\n<p><strong>Why it fails:</strong> Popular how? With whom? What would Jordan <em>do</em>? A wish has no first step, so the reader cannot picture a scene. Also, there is no cost. If Jordan stays unpopular, life goes on.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>Jordan wants to get a seat at the lunch table by the windows, because that is where Kai, her old best friend, sits now. If she cannot get over there before the winter dance, Kai will go with someone else and the friendship is probably over.</p>\n</blockquote>\n<p>The want is a place and a person. There is a deadline. The cost is a friendship. Now you can imagine Jordan carrying her tray across the cafeteria, and your stomach knots up.</p>\n<h3>Example 2: The hero who gets pushed around</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>Sam is walking home. A stranger gives him a map. A storm comes. A boat appears. Sam gets in the boat. A pirate tells him what to do.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> Things keep happening <em>to</em> Sam. He never decides anything. Readers lose interest when the hero is a leaf in the wind.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>Sam finds the map in the storm and could throw it away, but he recognizes his missing brother's handwriting on the margin. He chooses to steal a boat, a decision that gets him in trouble before he even leaves the dock.</p>\n</blockquote>\n<p>Same events, but now Sam makes a choice, and it costs him something. Choice is what turns a character into a hero.</p>\n<h3>Example 3: The flaw with no price</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>\"Riley is stubborn. But it never causes problems.\"</p>\n</blockquote>\n<p><strong>Why it fails:</strong> A flaw that never matters is just a label. It is like putting a fire alarm on the wall that never rings.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>Riley is stubborn. At the start, her stubbornness gets her the lead in the school play. Halfway through, it makes her ignore the director's warning, and the set collapses. At the end, she has to be stubborn in a new way: refusing to quit even after being laughed at.</p>\n</blockquote>\n<p>The flaw shows up early, causes real damage in the middle, and gets turned around at the end. That is a flaw doing a job.</p>\n<h2>How to build a hero in five lines</h2>\n<p>Fill in the blanks. Do it fast, then fix it later.</p>\n<ol>\n<li><strong>Name and one detail:</strong> \"Marcus, who hums when he is nervous.\"</li>\n<li><strong>Want:</strong> \"He wants to ___.\"</li>\n<li><strong>Why now:</strong> \"It has to happen by ___ because ___.\"</li>\n<li><strong>Cost:</strong> \"If he fails, he loses ___.\"</li>\n<li><strong>Flaw:</strong> \"He gets in his own way by ___.\"</li>\n</ol>\n<h2>Side characters need wants too</h2>\n<p>Your hero is not the only one with a destination. The best side characters want something of their own, and sometimes it clashes with the hero's want. A friend who wants to go home. A rival who wants the same trophy. A parent who wants the hero to quit. When two wants collide, you get scenes with built-in tension, and you barely have to work for it.</p>\n<p>A quick check: pick any side character and finish the sentence \"Right now, ___ wants ___.\" If you can't, they're furniture. Give them a want and watch them come alive.</p>\n<h2>Percy Jackson check</h2>\n<p>Percy wants to clear his name and save his mom. He cannot walk away: his mom has been taken, and a war is coming. His flaw, a hot temper and a reckless streak, causes real problems and also saves the day. What he needs, to trust his friends and accept who he is, is what he finds along the way.</p>\n<p>Look at how those pieces fit: a want he can say out loud (find the stolen bolt, get Mom back), a clock (ten days), and a cost that grows from \"I get blamed\" to \"the gods go to war.\" He also makes choices. He chooses to go on the quest instead of hiding at camp. That is why he does not feel like a passenger.</p>\n<p>A line in the same spirit, <strong>our own</strong> and not from the book: <em>\"I had exactly two options: do the smart thing, or do the thing I was already doing.\"</em> It shows the reckless flaw in one breath.</p>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>The perfect hero.</strong> No flaws means no friction. Give them something that costs them.</li>\n<li><strong>The vague want.</strong> If you cannot film it, sharpen it.</li>\n<li><strong>No cost.</strong> If nothing is at stake, the reader shrugs.</li>\n<li><strong>A flaw that is secretly a compliment.</strong> \"Her only weakness is that she cares too much\" is not a flaw. Make it a real problem, such as lying, bragging, or running away.</li>\n<li><strong>A hero who only reacts.</strong> Make them decide something big by the end of the first act.</li>\n<li><strong>A need that appears from nowhere.</strong> Plant hints early, so the lesson feels earned.</li>\n<li><strong>Explaining the hero instead of showing them.</strong> Do not write \"Maya was brave.\" Write the scene where she walks into the dark hallway while her knees shake.</li>\n<li><strong>Changing the want halfway for no reason.</strong> Wants can deepen, but they should not randomly swap.</li>\n</ul>\n<h2>Mini-quiz</h2>\n<p><strong>1. What is the difference between a want and a need?</strong>\n<em>Answer:</em> The want is what the hero chases. The need is the lesson or truth they must learn. Stories often let them chase one and find the other.</p>\n<p><strong>2. Why is \"Riley is stubborn, but it never causes problems\" a weak flaw?</strong>\n<em>Answer:</em> A flaw has to cost the hero something, or it does no work in the story.</p>\n<p><strong>3. How can you tell if a want is specific enough?</strong>\n<em>Answer:</em> If you could film it as an action or a result, it is specific.</p>\n<h2>Try it (20 min)</h2>\n<p>Fill in:</p>\n<blockquote>\n<p>\"My hero wants ___ because <strong><em>. If they fail, they lose </em></strong>. Their flaw is ___.\"</p>\n</blockquote>\n<p>If you cannot fill all four, the hero is not ready. Spend ten more minutes making each blank sharper. Then write one short scene (about 150 words) where the hero's flaw gets them into trouble on the way to the want.</p>\n<h2>Level up</h2>\n<p>Do the <strong>three-choice test</strong>. Take your hero and list three big decisions they make in your story. For each one, write:</p>\n<ul>\n<li>What are the options?</li>\n<li>Which one does the hero pick, and why?</li>\n<li>What does it cost?</li>\n</ul>\n<p>If a decision costs nothing, either raise the price or cut the scene. After that, try the <strong>mirror scene</strong>: write a short moment near the start where the hero faces a tiny version of their flaw, and another near the end where they face the same thing again but choose differently. A reader should feel the change without being told. The same small situation twice, with a new answer the second time, is one of the strongest tricks in all of storytelling.</p>"}, {"title": "Do You Need an Outline?", "html": "<h1>Do You Need an Outline?</h1>\n<p><em>9 min read</em></p>\n<p><strong>The picture:</strong> Some people hike with a printed route. Some people follow their nose. Both can get to the top. But the ones with no route should still carry a compass (that is your one-sentence story from the earlier chapter). Otherwise they end up three valleys over, holding a very good sandwich and no idea where they are.</p>\n<p>The honest answer to \"Do I need an outline?\" is: <em>you need some kind of plan, but it can be tiny.</em> Let's figure out what size fits you.</p>\n<h2>What an outline actually is</h2>\n<p>An <strong>outline</strong> is a list of the big moments, in order, so you can see if the story holds together before you spend 20 hours writing it. That's it. It is not a school essay with Roman numerals. It is not a contract. It is a cheat sheet you can change.</p>\n<p>Think of it as a rough sketch before a painting. A sketch costs five minutes. If the picture looks wrong, you erase it. Erasing a finished painting is much more painful.</p>\n<h2>Pick your style</h2>\n<ul>\n<li><strong>Plotter:</strong> you outline first. Good if you tend to lose the thread, forget what you planned, or write yourself into corners.</li>\n<li><strong>Pantser:</strong> you write \"by the seat of your pants,\" with no plan. Good if outlines make you freeze or bored. You must plan to rewrite more later, because you will find the story as you go.</li>\n<li><strong>Hybrid (try this first):</strong> a loose skeleton, with five to ten beats, and room to wander.</li>\n</ul>\n<p>A <strong>beat</strong> is one small story moment where something changes, such as \"the hero finds the map\" or \"the friend lies.\"</p>\n<p>None of these is the \"real\" way. Many professional writers switch depending on the story. The goal is a finished draft, not a pure style.</p>\n<h2>How to build a quick outline</h2>\n<ol>\n<li>Write the one-sentence story.</li>\n<li>Write 300 words of summary: beginning, middle, end.</li>\n<li>Break it into 8 to 15 beats, each one sentence.</li>\n<li>For each beat, add: <em>what does the hero want here? what goes wrong?</em></li>\n<li>Mark the biggest turn (the middle) and the big fight (near the end).</li>\n</ol>\n<p>If a new idea shows up while writing, ask: does it help the main line? If yes, keep it. If not, put it in an \"idea box\" for another story.</p>\n<h2>Three worked examples</h2>\n<h3>Example 1: The outline that is only a list of events</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<ol>\n<li>Zoe goes to the beach.</li>\n<li>She finds a bottle.</li>\n<li>She opens it.</li>\n<li>There is a note.</li>\n<li>She reads it.</li>\n<li>She goes home.</li>\n</ol>\n</blockquote>\n<p><strong>Why it fails:</strong> Each beat is just something that happens. Nothing is wanted, nothing goes wrong, and nothing connects. It is a diary, not a plot. Notice you could swap beats 4 and 5 and nobody would care.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<ol>\n<li>Zoe, who has just moved to a town where she knows nobody, wants one friend by Monday. She walks the beach to avoid the lonely house.</li>\n<li>She finds a bottle with a note that says, \"Meet me at the pier at sunset or I'm gone.\" She wants to know who wrote it.</li>\n<li>But the note is dated twelve years ago. Why would a bottle hold a deadline that old?</li>\n<li>She asks a shopkeeper. He goes pale and says to stay away from the pier. Now she is more curious and a little scared.</li>\n<li>She goes anyway, and meets a girl her age who says she wrote that note. But the girl has not aged a day.</li>\n</ol>\n</blockquote>\n<p>Each beat has a want or a problem, and each one <em>causes</em> the next. When you can say \"because of that, this happens,\" you have a plot. When you can only say \"and then,\" you have a list.</p>\n<h3>Example 2: The outline that is too detailed</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>37 beats, each with three sub-bullets, a color-coded spreadsheet, and the exact line of dialogue for every conversation. Time spent: two weeks. Words of actual story written: zero.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> The outline has become the project. Over-planning can be a sneaky way to avoid the scary part, which is writing. Also, you will change things as you write, which makes much of the detail wasted.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>Ten beats, one sentence each, plus a note on what changes at the halfway point. Time spent: forty minutes. Then start writing.</p>\n</blockquote>\n<p>Plan enough to feel safe, then go. The story will teach you the rest.</p>\n<h3>Example 3: The outline with no turn in the middle</h3>\n<p><strong>Weak version:</strong></p>\n<blockquote>\n<p>Hero wants to win the race. Hero trains. Hero trains more. Hero trains harder. Hero races. Hero wins.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> It is a straight line. Nothing surprises the hero (or us). The middle is just repeats of the same thing, which is why so many drafts \"sag\" there.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>Hero wants to win the race. Hero trains hard and gets faster. At the halfway point, she learns the rival is her new coach's daughter and the coach has been quietly helping the rival cheat on the course. Now she has to decide: win by the same rules the cheaters use, or tell the truth and probably lose her spot.</p>\n</blockquote>\n<p>A good middle has a <strong>turn</strong>, a moment that changes what the hero thinks the story is about. After the turn, the goal feels different.</p>\n<h2>When an outline helps most</h2>\n<table>\n<thead>\n<tr>\n<th>Situation</th>\n<th>Why an outline helps</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>You keep abandoning stories halfway</td>\n<td>You always know the next step</td>\n</tr>\n<tr>\n<td>Your story has a mystery or twist</td>\n<td>You need to plant clues in the right order</td>\n</tr>\n<tr>\n<td>You're writing with a deadline</td>\n<td>You can budget words per beat</td>\n</tr>\n<tr>\n<td>You're sharing the story with a friend</td>\n<td>They can see what you're building</td>\n</tr>\n</tbody>\n</table>\n<p>And when might you skip a detailed outline? When you are writing a quick scene for fun, or when you just need to find a voice. That is fine.</p>\n<h2>Percy Jackson check</h2>\n<p>The book's route is easy to map: learn about the gods, get the quest, travel across the country, hit a dark moment, face the villain, return. The structure is not a surprise to the author. The surprises are the monsters, jokes, and twists he put on the road.</p>\n<p>This is the secret about outlines: they do not make a story predictable, because the outline holds the <em>skeleton</em>, and the <em>flesh</em> (the voice, the jokes, the odd details) shows up when you write. Two writers could use the same skeleton and produce completely different books.</p>\n<p>A beat written in the same style, <strong>our own</strong> and not from the book: <em>\"Dani's team bus breaks down in the middle of nowhere, and the only help is a tow-truck driver who knows too much about the stolen mascot.\"</em> One sentence, and you can already feel the want, the problem, and the road.</p>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Outlining so much that you never write.</strong> Cap it. Forty minutes, then go.</li>\n<li><strong>Outlining so little that you get lost at the halfway mark.</strong> If you stall every time, add more beats.</li>\n<li><strong>Treating the outline as sacred.</strong> If a better idea shows up, follow it, then update the outline.</li>\n<li><strong>Beats that are only events.</strong> Add the want and the problem to each.</li>\n<li><strong>Skipping the ending.</strong> Even a rough idea of the end gives you something to aim at.</li>\n<li><strong>No middle turn.</strong> Mark the moment where the story changes direction.</li>\n<li><strong>Forgetting the idea box.</strong> Good ideas that don't fit are not wasted. Save them.</li>\n<li><strong>Comparing your method to someone else's.</strong> Your friend's way is their way. Use what gets you to \"The End.\"</li>\n</ul>\n<h2>Mini-quiz</h2>\n<p><strong>1. What is a beat?</strong>\n<em>Answer:</em> One small story moment where something changes.</p>\n<p><strong>2. What is the difference between a list of events and a plot?</strong>\n<em>Answer:</em> In a plot, each beat causes the next (\"because of that...\"). In a list, events just follow each other (\"and then...\").</p>\n<p><strong>3. What is a good first style for a beginner to try?</strong>\n<em>Answer:</em> A hybrid: a loose skeleton with five to ten beats and room to wander.</p>\n<h2>Try it (20 min)</h2>\n<ol>\n<li>Write your 8-beat outline on index cards (or sticky notes). One beat per card, one sentence each.</li>\n<li>Under each beat, add a short note: what does the hero want here, and what goes wrong?</li>\n<li>Lay the cards in a row. Mark the middle turn with a star.</li>\n<li>Then shuffle two cards and see if the story gets better or worse. Sometimes a swap shows you a stronger order. Sometimes it proves the first one was right.</li>\n</ol>\n<h2>Level up</h2>\n<p>Try the <strong>because-test</strong>. Read your beats in order, putting the word \"because\" or \"but\" between each pair (never just \"and then\"). For example: \"Zoe finds the note, <em>but</em> it is twelve years old, <em>because</em> the girl who wrote it is not what she seems.\" If any link only works with \"and then,\" that is a weak joint. Fix it by adding a cause, a choice, or a complication.</p>\n<p>For a second challenge, take a short story you already know and <strong>reverse-outline</strong> it. Read it, then list its beats afterward in one sentence each. Seeing how a published writer's skeleton looks is like looking at an X-ray. You learn where the bones go, and then you can build your own body around them.</p>"}, {"title": "The Three-Act Map", "html": "<h1>The Three-Act Map</h1>\n<p><em>8 min read</em></p>\n<p><strong>The picture:</strong> A story is like a rollercoaster. First you climb and get strapped in. Then comes the long ride with drops, loops, and turns. Then the big final drop and the slow roll back to the station.</p>\n<p>Nobody builds a rollercoaster by bolting random tracks together. Someone draws a map first. That map is what we call the <strong>three-act structure</strong>. An <strong>act</strong> is just a big chunk of a story, like a section of the ride. The map does not write your story for you. It just keeps you from getting lost.</p>\n<h2>The map</h2>\n<ul>\n<li><strong>Act 1 (about the first 10-25%): Setup.</strong> Show normal life, then break it (the <strong>inciting incident</strong>, which is the event that kicks the story into motion). End with the hero making a choice they cannot undo. That is the <strong>first turning point</strong>.</li>\n<li><strong>Act 2 (about the middle 50-60%): Confrontation.</strong> Things get harder. New friends, new enemies, bigger stakes. Halfway through, something big changes the game (the <strong>midpoint</strong>). It ends at the lowest point, when all seems lost.</li>\n<li><strong>Act 3 (about the last 15-25%): Resolution.</strong> The hero takes the final big action (the <strong>climax</strong>), and then the story settles (the <strong>ending</strong>).</li>\n</ul>\n<p>Here is the same thing as a quick table:</p>\n<table>\n<thead>\n<tr>\n<th>Act</th>\n<th>Job</th>\n<th>Ends with</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Show normal, then break it</td>\n<td>A choice with no way back</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Make it harder and harder</td>\n<td>The lowest point</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Fight the final fight, then settle</td>\n<td>A changed world and a changed hero</td>\n</tr>\n</tbody>\n</table>\n<h2>The rules</h2>\n<ul>\n<li><strong>Act 1 must end with a decision, not an accident.</strong> If trouble just drags the hero along, readers feel nothing. If the hero chooses, readers lean in.</li>\n<li><strong>The turning points must change the goal or the stakes.</strong> A turning point is not just \"something happens.\" It is \"something happens, and now the story is about something new.\"</li>\n<li><strong>Act 2 is not a waiting room.</strong> It is the longest part, and it is where most stories sag. Keep it moving with rising trouble (see the next chapters).</li>\n<li><strong>The lowest point should hurt.</strong> If the hero's worst moment is a mild bummer, the win at the end will feel small.</li>\n<li><strong>Percentages are guides, not laws.</strong> A short story may spend half its words in Act 1. A mystery may wait longer to break normal life. Use the map, but do not worship it.</li>\n</ul>\n<h2>A tool for scenes: LOCK</h2>\n<p>The acts are the big picture. Each scene needs its own tiny map. Use <strong>LOCK</strong>:</p>\n<ul>\n<li><strong>L</strong>ead: who is the hero here?</li>\n<li><strong>O</strong>bjective: what do they want in this scene?</li>\n<li><strong>C</strong>onfrontation: what stops them?</li>\n<li><strong>K</strong>nockout: how does the scene end, in a way that changes things?</li>\n</ul>\n<h2>Worked examples</h2>\n<h3>Example 1: A weak Act 1 turning point</h3>\n<blockquote>\n<p>Maya was a quiet kid who loved robots. One day a strange letter arrived, inviting her to a robotics academy on a floating island. A boat came to take her there. She got on.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> Everything happens <em>to</em> Maya. The letter arrives, the boat comes, she \"got on.\" There is no choice, no cost, and no feeling of a door slamming. A reader cannot tell what she is giving up.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>The letter said the boat would leave at midnight, and it said one more thing: <em>Bring nothing you can't carry.</em> Maya looked at her dad's workbench, the one he'd promised she could use forever. If she went, she'd have to leave his half-built robot behind. She took one screwdriver from the bench, put it in her pocket, and walked out into the dark.</p>\n</blockquote>\n<p><strong>Why it works:</strong> Now there is a cost (leaving her dad's project), a clock (midnight), and a small action that shows her choice (the screwdriver). The door closes behind her.</p>\n<h3>Example 2: A weak lowest point</h3>\n<blockquote>\n<p>Things looked bad for Jonas. His team lost the first round of the contest. But he shrugged, stayed positive, and tried again.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> There is no real loss. Jonas shrugs it off, so the reader does too. The lowest point has to take away something the hero needs.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>The judges disqualified Jonas's team, and the worst part was why: his best friend had quietly copied the rules wrong. Jonas packed up the broken machine alone. The bus left without him. He stood in the empty parking lot with a dead phone and a trophy-sized hole in his plans.</p>\n</blockquote>\n<p><strong>Why it works:</strong> He loses the contest, a friend, and his ride. Now Act 3 has something to fix, and the reader wants to see him fix it.</p>\n<h3>Example 3: A scene with LOCK</h3>\n<p>Let's build one scene for a hero named Priya who needs to sneak a library book out of a locked archive.</p>\n<ul>\n<li><strong>Lead:</strong> Priya</li>\n<li><strong>Objective:</strong> Get the book without anyone noticing</li>\n<li><strong>Confrontation:</strong> The night guard sits right next to the shelf and loves chatting</li>\n<li><strong>Knockout:</strong> She gets the book, but the guard sees her face and says her name. Now he knows.</li>\n</ul>\n<p>That last line is the key. The scene does not just end. It <em>changes</em> things.</p>\n<h2>Checking your map: the five beats</h2>\n<p>If you want a quick x-ray of your story, find these five beats. Write one sentence for each.</p>\n<ol>\n<li><strong>Normal world:</strong> What does life look like before the trouble?</li>\n<li><strong>Inciting incident:</strong> What event breaks it?</li>\n<li><strong>First turning point:</strong> What choice sends the hero through the door?</li>\n<li><strong>Midpoint:</strong> What twist changes the question?</li>\n<li><strong>Lowest point:</strong> What is taken away right before the final push?</li>\n</ol>\n<p>Here is a made-up example for a story about a girl who runs a tiny lemonade stand and wants to save her street's block party:</p>\n<ol>\n<li>Ruby sells lemonade every Saturday and knows every neighbor by name.</li>\n<li>A letter says the city will tear up the street's park for a parking lot.</li>\n<li>Ruby chooses to collect signatures, even though it means skipping her own birthday party.</li>\n<li>At the halfway mark she learns the letter was sent by her favorite neighbor, who needs the money.</li>\n<li>The signatures get thrown away, and Ruby's friends say she is making things worse.</li>\n</ol>\n<p>Notice that the story now has real energy. The \"villain\" is a friend, so the final act can be about understanding, not just winning. That kind of twist often comes from asking, \"What is the most interesting way for this to go wrong?\"</p>\n<h2>Why the map helps even if you hate outlines</h2>\n<p>Some writers feel that maps kill the fun. Try thinking of it this way: a map does not choose where you go on vacation. It just stops you from driving in circles. If you write by feel, you can still use the three acts after the first draft, like a flashlight. Shine it on your story and ask, \"Where does the ride go flat?\" Usually the answer is a place where the hero stopped choosing or the stakes stopped growing. Fix that spot, and the rest tends to fall into line.</p>\n<h2>Common mistakes</h2>\n<ol>\n<li><strong>No real choice at the end of Act 1.</strong> The hero is just carried along.</li>\n<li><strong>A midpoint that is only a bigger explosion.</strong> A real midpoint changes what the hero <em>believes</em> or <em>wants</em>.</li>\n<li><strong>A lowest point that is too soft.</strong> Take something away that matters.</li>\n<li><strong>Skipping Act 2 trouble.</strong> Going from \"quest begins\" straight to \"final fight\" with a few easy scenes between feels thin.</li>\n<li><strong>Following the percentages like a recipe.</strong> If a scene is boring, math will not save it.</li>\n<li><strong>Scenes with no knockout.</strong> If nothing changes, it is a pause, not a scene.</li>\n</ol>\n<h2>Percy Jackson check</h2>\n<p>Act 1: Percy is attacked, learns about the gods, and heads out on the quest. Act 2: the road trip, each stop a challenge. The Oracle's prophecy hints at betrayal. Dark moment: the Underworld and the lost bolt. Act 3: the fight on Mount Olympus, the traitor revealed, and the return home.</p>\n<p>Notice the shape: a clear break from normal life (a monster in the classroom), a choice that commits him to the journey, a long road with growing danger, and a low point where everything seems to be failing. That is the rollercoaster in action.</p>\n<p><em>Our own imitation line, not from the book:</em> \"The bus doors folded shut, and for the first time in his life, Eli knew exactly where he was going. That was the problem.\"</p>\n<h2>Mini-quiz</h2>\n<ol>\n<li>What is the job of the first turning point?</li>\n<li>In LOCK, what does the K stand for, and why does it matter?</li>\n<li>True or false: Act 2 should be the part where the story rests while the hero gets ready for the finale.</li>\n</ol>\n<p><strong>Answers</strong></p>\n<ol>\n<li>To end Act 1 with a choice the hero cannot undo, so the story is now about the journey, not about normal life.</li>\n<li>Knockout. It makes the scene end with a change, so the story keeps moving.</li>\n<li>False. Act 2 should keep raising trouble. Rest in small doses only.</li>\n</ol>\n<h2>Try it (20 min)</h2>\n<p>Draw three boxes for the acts. Write your first turning point (the choice that closes the door behind your hero). Then write one line for your lowest point, and make sure it takes away something your hero needs.</p>\n<h2>Level up</h2>\n<p>Pick a movie or book you know well and fill in the three boxes from memory. Name the inciting incident, the first turning point, the midpoint, and the lowest point. Then pick one scene and write its LOCK in four short lines. If you cannot find the knockout, that scene might be a good candidate for cutting.</p>"}, {"title": "The Opening: Start Where Things Change", "html": "<h1>The Opening: Start Where Things Change</h1>\n<p><em>8 min read</em></p>\n<p><strong>The picture:</strong> Walking into a party, you decide in about ten seconds whether to stay. Readers do the same with your first page. Start at the doorway of the loud room, not in the parking lot.</p>\n<p>Your opening has a small job and a big job. The small job: get the reader to read page two. The big job: tell them what kind of story this is and who to care about. You do not need to explain the whole world. You just need to open the door.</p>\n<h2>The rules</h2>\n<ul>\n<li><strong>Start at the moment normal breaks.</strong> Not at birth, not at \"a regular Tuesday,\" not with the hero waking up and brushing their teeth.</li>\n<li><strong>Raise a question in the first 200 words or so.</strong> Who is that? Why is she running? What is in the box? A question the reader wants answered is a hook (a pull that keeps people reading).</li>\n<li><strong>Show a hint of normal life through action,</strong> not a lecture. One telling detail beats a paragraph of backstory. (<strong>Backstory</strong> is what happened before the story started.)</li>\n<li><strong>Make it clear whose story this is.</strong> Readers need someone to hold onto.</li>\n<li><strong>Promise something.</strong> The opening tells the reader what kind of ride this is: funny, scary, strange.</li>\n<li><strong>Ground the reader.</strong> Give just enough: who, where, and a hint of when. Confused is good. Lost is not.</li>\n<li><strong>Use a voice.</strong> A distinct way of talking makes a page feel alive even before the plot gets going.</li>\n</ul>\n<h2>Where to cut in</h2>\n<p>Write your opening, then ask: could I cut the first page and lose nothing? If yes, cut it. Many writers find their real first line hiding on page two or three.</p>\n<p>A handy trick: find the first sentence where something <em>happens or changes</em>. Start there, and slip any needed background into later lines.</p>\n<h2>Worked examples</h2>\n<h3>Example 1: Starting in the parking lot</h3>\n<blockquote>\n<p>It was a sunny Saturday morning in the town of Millbrook. Birds sang in the trees. Dara woke up, stretched, and went downstairs to eat cereal. Her mom was reading the newspaper. Dara had a soccer game later that day, and she was a little nervous about it.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> Nothing is wrong. Nothing is strange. The reader learns the weather, the cereal, and the mom's hobby. Nothing pulls them forward. \"A little nervous\" is too vague to feel.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>The cereal box on the counter had Dara's name on it, which was weird, because Dara had never bought cereal in her life. Inside was a note: <em>Do not play in today's game.</em> She glanced at her mom, who was reading the paper and had not looked up once.</p>\n</blockquote>\n<p><strong>Why it works:</strong> We still see breakfast, a mom, and an ordinary kitchen. But now the ordinary has a crack in it. A question appears right away: who wrote the note, and why?</p>\n<h3>Example 2: The info dump</h3>\n<blockquote>\n<p>Long ago, the five kingdoms of Aerlon were ruled by the Sun Council, who drew their power from the seven crystals. Each crystal had a different color and a different purpose. The Red Crystal powered fire, the Blue Crystal powered water, and so on. Kael was a farm boy who lived in the third kingdom.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> This is a history lesson. A reader has to remember five kingdoms, seven crystals, and a council before meeting a single person. Nobody is in trouble yet.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>Kael was hauling water when the well started glowing. Not a little glow, either. Blue light climbed out of the bucket and up his arm. The last person in his village who had seen light like that had been taken away by soldiers.</p>\n</blockquote>\n<p><strong>Why it works:</strong> The world still shows up (soldiers, magic, a village). But it arrives through a person and an event, and we only get what we need to feel the danger. The crystals can wait until chapter three.</p>\n<h3>Example 3: Voice and promise</h3>\n<blockquote>\n<p>Hello. My name is Theo, and I have to warn you: this is the story of how I got stuck in a vending machine. If you are the kind of person who likes things to make sense, you should put this book down now.</p>\n</blockquote>\n<p><strong>Why it works:</strong> In three sentences, we learn the narrator's voice (funny, a little cranky), the promise (a weird, comic mess), and a question (how did he get <em>in</em> there?). Not every book needs a voice this loud. But every opening needs to promise <em>something</em>.</p>\n<h3>Example 4: Too many names</h3>\n<blockquote>\n<p>Captain Voss, Lieutenant Marrow, Dr. Penhallow, young Tilly, old Barnaby, and the twins, Rex and Rue, all stood on the deck of the <em>Silver Gull</em> as it left Port Alder.</p>\n</blockquote>\n<p><strong>Why it fails:</strong> That is seven names and two places in one sentence. The reader does not know who to follow, so they follow no one.</p>\n<p><strong>Stronger version:</strong></p>\n<blockquote>\n<p>Tilly gripped the rail of the <em>Silver Gull</em> and tried not to look at the Captain, who was looking right at her. Everyone else on deck had gone quiet. She was the only one who knew what was in the crate.</p>\n</blockquote>\n<p><strong>Why it works:</strong> One hero, one ship, one tense secret. The others can be named when they matter, one at a time.</p>\n<h2>The first-page checklist</h2>\n<p>Before you move on, test your first page with these quick questions:</p>\n<ol>\n<li>Do I know <strong>who</strong> this is about?</li>\n<li>Do I know roughly <strong>where</strong> we are?</li>\n<li>Is something <strong>wrong, odd, or changing</strong>?</li>\n<li>Is there a <strong>question</strong> I want answered?</li>\n<li>Can I <strong>hear a voice</strong>, even a quiet one?</li>\n</ol>\n<p>If you can say yes to at least four, you are in good shape. If not, pick the weakest one and fix it first.</p>\n<h2>Quick fixes for a flat first line</h2>\n<ul>\n<li>Replace a general statement with a specific object. Not \"It was a strange day,\" but \"The bus driver was wearing two left shoes.\"</li>\n<li>Move a line of dialogue up. People talking is faster than people thinking.</li>\n<li>Cut the first sentence and see if the second one works better. It often does.</li>\n</ul>\n<h2>A note on perfection</h2>\n<p>Your opening is the part you will rewrite the most. That is normal. Many writers draft the first chapter last, because only then do they know what the story actually promises. If you are stuck, skip ahead and come back. A rough opening that lets you finish a draft beats a perfect one that keeps you frozen.</p>\n<h2>Common mistakes</h2>\n<ol>\n<li><strong>A weather report or long description before anything happens.</strong> One sharp detail does the job of five.</li>\n<li><strong>An info dump about the world, history, or magic rules.</strong> Slip it in later, a little at a time.</li>\n<li><strong>Too many names in the first page.</strong> Three characters, maximum. Four, if you are brave.</li>\n<li><strong>Starting too early,</strong> with ten pages before the real trouble.</li>\n<li><strong>A fake-out</strong> (\"it was all a dream\") that cheats the reader.</li>\n<li><strong>Starting with a mirror.</strong> Hero looks in the mirror to describe themselves. It is a cliche for a reason.</li>\n<li><strong>Action with no person in it.</strong> A car chase is boring if we do not know who is in the car or why they care.</li>\n<li><strong>Hiding everything to be mysterious.</strong> A question is good. Total confusion is not.</li>\n</ol>\n<h2>Percy Jackson check</h2>\n<p>Percy's story begins with a school trip going wrong, and with the narrator warning the reader: if you think you might be a demigod, close this book. It sets voice, humor, and danger in a few lines. Then a teacher turns into a monster. Normal life breaks quickly.</p>\n<p>What to steal: the book makes a <em>promise</em> in its first lines, a funny but dangerous tone, and keeps it. You can see the voice before you see the plot.</p>\n<p><em>Our own imitation line, not from the book:</em> \"If your lunch lady ever asks to see your hands, and she says it in a very low voice, do not hand over your pudding. Run.\"</p>\n<h2>Mini-quiz</h2>\n<ol>\n<li>Why is \"a regular Tuesday\" a risky way to begin?</li>\n<li>What is a hook?</li>\n<li>You have a cool magic system with seven rules. Where should the rules go in your opening?</li>\n</ol>\n<p><strong>Answers</strong></p>\n<ol>\n<li>Because nothing has changed yet. Without a crack in normal life, readers have no reason to worry or wonder.</li>\n<li>Something in the writing, usually a question or a surprise, that makes the reader want to keep going.</li>\n<li>Mostly not in the opening. Show one rule in action through a character, and save the rest for later when the reader needs it.</li>\n</ol>\n<h2>Try it (20 min)</h2>\n<p>Take your first paragraph.
